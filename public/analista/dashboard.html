<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard de SLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .panel-page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 24px; }
  .panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .panel-head h1 { font-size: 24px; }
  .panel-head .lede { color: var(--ink-700); font-size: 14px; margin-top: 6px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-700); margin: 28px 0 12px; }
  .section-title:first-of-type { margin-top: 0; }

  .analyst-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .analyst-card { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .analyst-card-head { display: flex; align-items: center; gap: 10px; }
  .analyst-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; color: #fff; background: var(--row-color);
  }
  .analyst-card-head .name { font-weight: 700; font-size: 15px; }
  .analyst-card-head .sub { font-size: 11.5px; color: var(--ink-500); }
  .analyst-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .amet .v { font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
  .amet .l { font-size: 10.5px; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .amet .v.ok { color: var(--ok); } .amet .v.warn { color: var(--warn); } .amet .v.danger { color: var(--danger); }

  .load-row { display: flex; align-items: center; gap: 10px; }
  .load-track { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-100); overflow: hidden; }
  .load-fill { height: 100%; border-radius: 4px; }
  .load-value { font-family: var(--font-mono); font-size: 12.5px; width: 22px; text-align: right; flex-shrink: 0; }

  .overdue-wrap { background: var(--paper-50); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
  .loading-note { color: var(--ink-500); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <a class="brand" href="./painel.html">
      <span class="brand-mark">CI</span>
      <span class="brand-text">Central de Chamados</span>
      <span class="brand-sub">Comunicação&nbsp;Interna</span>
    </a>
    <div class="topbar-right">
      <nav class="tabs" aria-label="Navegação interna">
        <a class="tab-btn" href="./painel.html">Painel</a>
        <a class="tab-btn" href="./dashboard.html" aria-current="page">Dashboard &amp; SLA</a>
        <a class="tab-btn" href="./regras.html">Roteamento</a>
        <a class="tab-btn" href="./operacoes.html" id="nav-operacoes-link" style="display:none;">Visitas em Loja</a>
      </nav>
      <div class="session-chip">
        <span class="session-avatar" id="session-avatar"></span>
        <span><span class="session-name" id="session-name"></span><br><span class="session-role" id="session-role"></span></span>
      </div>
      <button class="logout-btn" id="btn-logout">Sair</button>
    </div>
  </header>

  <main>
    <div class="panel-page">
      <div class="panel-head">
        <div>
          <h1>Dashboard de demandas e SLA</h1>
          <p class="lede">Restrito à coordenação — carga e cumprimento de prazo por analista.</p>
        </div>
      </div>
      <div id="dashboard-root"><div class="loading-note">Carregando…</div></div>
    </div>
  </main>
</div>

<script src="../shared/format-utils.js"></script>
<script src="../shared/api-client.js"></script>
<script src="../shared/auth-client.js"></script>
<script>
(function () {
  "use strict";
  const Fmt = window.Fmt;
  const Api = window.Api;

  function slaTierClass(pct) {
    if (pct == null) return "";
    return pct >= 90 ? "ok" : pct >= 70 ? "warn" : "danger";
  }

  function render(m) {
    const root = document.getElementById("dashboard-root");
    const slaTxt = m.slaPctGeral == null ? "—" : m.slaPctGeral + "%";
    const maxTotal = Math.max(1, ...m.porAnalista.map((a) => a.total));

    const statHtml =
      `<div class="stat-row">` +
      `<div class="stat"><div class="num tabular">${m.geral.total}</div><div class="label">Total de chamados</div></div>` +
      `<div class="stat"><div class="num tabular">${m.geral.abertos}</div><div class="label">Em aberto</div></div>` +
      `<div class="stat"><div class="num tabular ${m.geral.atrasados > 0 ? "danger" : ""}">${m.geral.atrasados}</div><div class="label">Atrasados agora</div></div>` +
      `<div class="stat"><div class="num tabular ${slaTierClass(m.slaPctGeral)}">${slaTxt}</div><div class="label">SLA cumprido (resolvidos)</div></div>` +
      `</div>`;

    const cardsHtml = m.porAnalista
      .map((a) => {
        const pct = a.total ? Math.round((a.total / maxTotal) * 100) : 0;
        const slaTxtA = a.slaPct == null ? "—" : a.slaPct + "%";
        const tempoTxt = a.tempoMedioResolucaoHoras == null ? "—" : Fmt.fmtHoras(a.tempoMedioResolucaoHoras);
        return `<div class="card analyst-card" style="--row-color:${a.analista.cor}">
          <div class="analyst-card-head">
            <span class="analyst-avatar">${Fmt.escapeHtml(Fmt.initials(a.analista.nome))}</span>
            <div><div class="name">${Fmt.escapeHtml(a.analista.nome)}</div><div class="sub">${a.total} chamado${a.total === 1 ? "" : "s"} no total</div></div>
          </div>
          <div class="load-row">
            <div class="load-track"><div class="load-fill" style="width:${pct}%;background:${a.analista.cor}"></div></div>
            <span class="load-value tabular">${a.total}</span>
          </div>
          <div class="analyst-metrics">
            <div class="amet"><div class="v tabular ${a.atrasados > 0 ? "danger" : ""}">${a.atrasados}</div><div class="l">Atrasados</div></div>
            <div class="amet"><div class="v tabular">${tempoTxt}</div><div class="l">Tempo médio</div></div>
            <div class="amet"><div class="v tabular ${slaTierClass(a.slaPct)}">${slaTxtA}</div><div class="l">SLA cumprido</div></div>
          </div>
        </div>`;
      })
      .join("");

    const overdueRows = m.atrasados.length
      ? m.atrasados
          .map((c) => {
            const a = m.porAnalista.find((x) => x.analista.id === c.analistaPrincipalId)?.analista;
            const cor = a ? a.cor : "#999";
            return `<tr style="--row-color:${cor}">
              <td class="cell-proto tabular">${Fmt.escapeHtml(c.protocolo)}</td>
              <td><span class="analista-chip" style="--row-color:${cor}"><span class="dot"></span>${a ? Fmt.escapeHtml(a.nome) : "A triar"}</span></td>
              <td class="tabular">${Fmt.fmtDateTime(c.dataAbertura)}</td>
              <td class="tabular">${Fmt.fmtDateTime(c.dataPrazo)}</td>
              <td><span class="status-pill sla-atrasado">Atrasado</span></td>
            </tr>`;
          })
          .join("")
      : `<tr class="empty-row"><td colspan="5">Nenhum chamado em atraso no momento.</td></tr>`;

    root.innerHTML =
      statHtml +
      `<div class="section-title">Por analista</div><div class="analyst-grid">${cardsHtml}</div>` +
      `<div class="section-title">Chamados em atraso agora</div>` +
      `<div class="overdue-wrap"><table class="sheet"><thead><tr><th>Protocolo</th><th>Analista</th><th>Aberto em</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>${overdueRows}</tbody></table></div>`;
  }

  document.getElementById("btn-logout").addEventListener("click", () => window.AuthClient.logout());

  async function init() {
    const sessao = await Api.get("/auth/session");
    if (!sessao.autenticado) return window.location.replace("./login.html");
    if (sessao.papel !== "coordenador") return window.location.replace("./painel.html?dashboard=negado");

    document.getElementById("session-avatar").textContent = Fmt.initials(sessao.nome);
    document.getElementById("session-avatar").style.setProperty("--session-color", sessao.cor);
    document.getElementById("session-name").textContent = sessao.nome;
    document.getElementById("session-role").textContent = "Coordenação";
    document.getElementById("nav-operacoes-link").style.display = "";

    try {
      const m = await Api.get("/api/dashboard");
      render(m);
    } catch (err) {
      document.getElementById("dashboard-root").innerHTML = `<div class="loading-note">Não foi possível carregar o dashboard.</div>`;
    }
  }

  init();
})();
</script>
</body>
</html>
